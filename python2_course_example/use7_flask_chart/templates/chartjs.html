<!DOCTYPE html>
<html>
  <head>
    <title>Chart.js 차트 | Web Application 만들기</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 기본 템플릿 안에 삽입될 내용 End -->
  </head>

  <body>
    <h1>현재 기온/습도</h1>
    <div>
      <button onclick="window.location.href='/'">차트 닫기</button>
    </div>
    <div>
      <h2>Chart.js 차트</h2>
      <canvas id="myChart" width="800" height="400"></canvas>
      <script>
        // Flask에서 전달한 데이터 가져오기
        var data = {{ data | tojson | safe }};

        // chart.js에서 Getting Started로 이동
        // https://www.chartjs.org/docs/latest/getting-started/
        const ctx = document.getElementById("myChart");

        new Chart(ctx, {
          type: "bar",
          data: {
            labels: data[0], // 수정
            datasets: [
              {
                label: "온도", // 수정
                data: data[1], // 수정
                borderWidth: 1,
              },
              {
                label: "습도", // 수정
                data: data[2], // 수정
                borderWidth: 1,
              },
            ],
          },
          options: {
            scales: {
              y: {
                beginAtZero: true,
              },
            },
          },
        });
      </script>
    </div>
  </body>
</html>
