
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 드레스 코드</title>
    <style>
        /* General Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(to bottom right, #e0eaff, #f0f8ff); /* Light sky gradient */
            color: #333;
            padding: 20px;
            box-sizing: border-box;
        }

        .infographic-container {
            width: 90%;
            max-width: 850px;
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            border: 1px solid #ddd;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 2.5em;
            letter-spacing: -1px;
        }

        /* Weather Info Section */
        .weather-info {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap; /* Allow wrapping on smaller screens */
            background-color: #f8faff;
            border-radius: 15px;
            padding: 25px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
            border: 1px solid #eee;
        }

        .weather-card {
            text-align: center;
            flex: 1 1 200px; /* Flex basis for wrapping */
            padding: 10px;
            margin: 5px;
            min-width: 120px; /* Minimum width for each card */
        }

        .weather-card:not(:last-child) {
            border-right: 1px solid #e0e0e0;
        }

        .weather-card .icon {
            font-size: 3.5em;
            margin-bottom: 5px;
            display: block;
        }
        .weather-card.temp .icon { color: #e74c3c; } /* Red for temperature */
        .weather-card.wind .icon { color: #2ecc71; } /* Green for wind */
        .weather-card.humidity .icon { color: #f39c12; } /* Orange for humidity */
        .weather-card.sky .icon { color: #3498db; } /* Blue for sky */

        .weather-card p {
            margin: 0;
            font-size: 1.3em;
            font-weight: bold;
            color: #555;
        }
        .weather-card span {
            display: block;
            font-size: 0.9em;
            color: #777;
            margin-top: 5px;
        }

        /* Dress Code Section */
        .dress-code {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            font-size: 2em;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .recommendation-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 20px;
            justify-items: center;
        }

        .clothing-item {
            text-align: center;
            background-color: #f0f8ff;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease-in-out;
            border: 1px solid #e0eaff;
            width: 100%; /* Ensure items take full grid column width */
            box-sizing: border-box;
            max-width: 150px; /* Limit max width for grid items */
        }

        .clothing-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .clothing-item .icon {
            font-size: 4em;
            margin-bottom: 10px;
            display: block;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* Specific colors for items for better distinction (using emojis for icons) */
        .clothing-item.coat .icon { color: #1a237e; } /* Dark blue for coat */
        .clothing-item.sweater .icon { color: #795548; } /* Brown for sweater */
        .clothing-item.pants .icon { color: #455a64; } /* Dark grey for pants */
        .clothing-item.boots .icon { color: #5d4037; } /* Dark brown for boots */
        .clothing-item.scarf .icon { color: #d32f2f; } /* Red for scarf */
        .clothing-item.hat .icon { color: #fbc02d; } /* Yellow for hat */
        .clothing-item.gloves .icon { color: #00796b; } /* Teal for gloves */
        .clothing-item.thermal .icon { color: #bf360c; } /* Dark orange for thermal */


        .clothing-item p {
            margin: 0;
            font-weight: bold;
            color: #444;
            font-size: 1.1em;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .infographic-container {
                padding: 25px;
                width: 95%;
            }
            h1 {
                font-size: 2em;
            }
            h2 {
                font-size: 1.7em;
            }
            .weather-info {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }
            .weather-card {
                border-right: none;
                border-bottom: 1px solid #e0e0e0;
                width: 100%;
                padding-bottom: 15px;
            }
            .weather-card:last-child {
                border-bottom: none;
            }
            .weather-card .icon {
                font-size: 3em;
            }
            .weather-card p {
                font-size: 1.1em;
            }
            .clothing-item .icon {
                font-size: 3.5em;
            }
            .clothing-item p {
                font-size: 1em;
            }
            .recommendation-grid {
                grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
                gap: 15px;
            }
        }

        @media (max-width: 480px) {
            .infographic-container {
                border-radius: 10px;
                padding: 20px;
            }
            h1 {
                font-size: 1.7em;
            }
            h2 {
                font-size: 1.4em;
                margin-bottom: 15px;
            }
            .clothing-item .icon {
                font-size: 3em;
            }
            .clothing-item p {
                font-size: 0.9em;
            }
            .recommendation-grid {
                grid-template-columns: repeat(2, 1fr); /* 2 columns on very small screens */
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="infographic-container">
        <h1>🌬️ 오늘 외출 드레스 코드 🥶</h1>

        <div class="weather-info">
            <div class="weather-card temp">
                <span class="icon">🌡️</span>
                <p>3.25°C</p>
                <span>현재 온도</span>
            </div>
            <div class="weather-card wind">
                <span class="icon">💨</span>
                <p>6.29 m/s</p>
                <span>바람</span>
            </div>
            <div class="weather-card humidity">
                <span class="icon">💧</span>
                <p>51.0%</p>
                <span>상대 습도</span>
            </div>
            <div class="weather-card sky">
                <span class="icon">✨</span>
                <p>맑음</p>
                <span>하늘 상태</span>
            </div>
        </div>

        <h2>차가운 바람, 매서운 날씨! 🌬️ 따뜻하게 겹쳐 입으세요!</h2>

        <div class="dress-code">
            <div class="recommendation-grid">
                <div class="clothing-item coat">
                    <span class="icon">🧥</span>
                    <p>두꺼운 패딩/코트</p>
                </div>
                <div class="clothing-item sweater">
                    <span class="icon">🧶</span>
                    <p>따뜻한 스웨터</p>
                </div>
                <div class="clothing-item thermal">
                    <span class="icon">🎽</span>
                    <p>기모/내복</p>
                </div>
                <div class="clothing-item pants">
                    <span class="icon">👖</span>
                    <p>두꺼운 바지</p>
                </div>
                <div class="clothing-item boots">
                    <span class="icon">👢</span>
                    <p>방한 부츠</p>
                </div>
                <div class="clothing-item scarf">
                    <span class="icon">🧣</span>
                    <p>목도리</p>
                </div>
                <div class="clothing-item hat">
                    <span class="icon"> beanie </span>
                    <p>따뜻한 모자</p>
                </div>
                <div class="clothing-item gloves">
                    <span class="icon">🧤</span>
                    <p>장갑</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
